          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
      volumes: [{name: mappings, configMap: {name: appointment-provider-mock-mappings}}]
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-provider-mock
  namespace: cvp
spec:
