apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maintenance-reminder-ingress
  namespace: cvp
spec:
  ingressClassName: nginx
  rules:
    - host: maintenance-reminder.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maintenance-reminder
                port:
                  number: 8080