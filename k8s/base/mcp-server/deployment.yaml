apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: cvp
  labels: { app: mcp-server, app.kubernetes.io/name: cvp-mcp-server, app.kubernetes.io/part-of: cvp-platform }
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } }
  selector: { matchLabels: { app: mcp-server } }
  template:
    metadata: { labels: { app: mcp-server, app.kubernetes.io/name: cvp-mcp-server, app.kubernetes.io/part-of: cvp-platform } }
    spec:
      containers:
        - name: mcp
          image: docker.io/library/cvp-mcp-server:k8s-20261104-1608
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8090 }]
          envFrom: [{ configMapRef: { name: cvp-app-config } }]
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, initialDelaySeconds: 20, timeoutSeconds: 10, periodSeconds: 5 }
          startupProbe: { httpGet: { path: /actuator/health, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 180 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, initialDelaySeconds: 50, timeoutSeconds: 10, periodSeconds: 15, failureThreshold: 6 }
          resources: { requests: { cpu: 80m, memory: 160Mi }, limits: { cpu: 600m, memory: 384Mi } }
