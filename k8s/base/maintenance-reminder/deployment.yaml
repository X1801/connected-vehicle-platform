apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-reminder-service
  namespace: cvp
  labels: { app: maintenance-reminder-service, app.kubernetes.io/name: cvp-maintenance-reminder-service, app.kubernetes.io/part-of: cvp-platform }
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } }
  selector: { matchLabels: { app: maintenance-reminder-service } }
  template:
    metadata: { labels: { app: maintenance-reminder-service, app.kubernetes.io/name: cvp-maintenance-reminder-service, app.kubernetes.io/part-of: cvp-platform } }
    spec:
      containers:
        - name: maintenance-reminder
          image: docker.io/library/cvp-maintenance-reminder-service:k8s-20261104-1608
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: cvp-app-config } }]
          env:
            - name: CVP_MAINTENANCE_REMINDER_DB_USERNAME
              value: cvp_test
            - name: CVP_MAINTENANCE_REMINDER_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: cvp-database-credentials, key: CVP_DB_PASSWORD } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, initialDelaySeconds: 20, timeoutSeconds: 10, periodSeconds: 5 }
          startupProbe: { httpGet: { path: /actuator/health, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 180 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, initialDelaySeconds: 60, timeoutSeconds: 10, periodSeconds: 15, failureThreshold: 6 }
          resources: { requests: { cpu: 120m, memory: 256Mi }, limits: { cpu: 800m, memory: 512Mi } }
