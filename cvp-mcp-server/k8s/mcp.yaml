apiVersion: v1
kind: ConfigMap
metadata: { name: cvp-connect-mcp-config, namespace: cvp }
data: { MAINTENANCE_REMINDER_BASE_URL: http://maintenance-reminder.cvp.svc.cluster.local:8080, TELEMETRY_BASE_URL: http://cvp-telemetry-service.cvp.svc.cluster.local:8080, INVENTORY_BASE_URL: http://cvp-inventory-service.cvp.svc.cluster.local:8080, MCP_DOWNSTREAM_TIMEOUT: 5s }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cvp-mcp-server, namespace: cvp }
spec:
  replicas: 1
  selector: { matchLabels: { app: cvp-mcp-server } }
  template:
    metadata: { labels: { app: cvp-mcp-server } }
    spec:
      containers:
        - name: mcp
          image: cvp-mcp-server:20261005-234700
          envFrom: [ { configMapRef: { name: cvp-connect-mcp-config } } ]
          ports: [ { containerPort: 8090 } ]
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8090 }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8090 } }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8090 } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: cvp-mcp-server, namespace: cvp }
spec: { type: ClusterIP, selector: { app: cvp-mcp-server }, ports: [ { port: 8090, targetPort: 8090 } ] }
