spring.application.name=cvp-mcp-server
server.port=8090
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.annotation-scanner.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
mcp.downstream.timeout=${MCP_DOWNSTREAM_TIMEOUT:5s}
mcp.maintenance-reminder-base-url=${MAINTENANCE_REMINDER_BASE_URL:${CVP_MAINTENANCE_REMINDER_BASE_URL:http://maintenance-reminder.cvp.svc.cluster.local:8080}}
mcp.telemetry-base-url=${TELEMETRY_BASE_URL:http://cvp-telemetry-service.cvp.svc.cluster.local:8080}
mcp.inventory-base-url=${INVENTORY_BASE_URL:http://cvp-inventory-service.cvp.svc.cluster.local:8080}
