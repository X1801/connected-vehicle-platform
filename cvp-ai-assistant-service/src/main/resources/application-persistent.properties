spring.autoconfigure.exclude=
spring.datasource.url=${ASSISTANT_DB_URL:jdbc:postgresql://localhost:5432/ai_assistant}
spring.datasource.username=${ASSISTANT_DB_USERNAME:ai_assistant}
spring.datasource.password=${ASSISTANT_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
assistant.rag.ingest-on-startup=${ASSISTANT_RAG_INGEST_ON_STARTUP:false}
