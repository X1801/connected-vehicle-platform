spring.application.name=cvp-ai-assistant-service
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
server.error.include-message=never
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
assistant.turn-timeout=20s
assistant.vehicle-access.allow-all=false
assistant.vehicle-access.allowed-vehicles=${ASSISTANT_VEHICLE_ACCESS_ALLOWED_VEHICLES:}
assistant.security.mock-authentication-enabled=${ASSISTANT_MOCK_AUTHENTICATION_ENABLED:true}
assistant.clients.maintenance-reminder-base-url=${MAINTENANCE_REMINDER_BASE_URL:http://localhost:8080}
assistant.clients.telemetry-base-url=${TELEMETRY_BASE_URL:http://localhost:8081}
assistant.clients.inventory-base-url=${INVENTORY_BASE_URL:http://localhost:8085}
assistant.clients.connect-timeout=${ASSISTANT_HTTP_CONNECT_TIMEOUT:3s}
assistant.clients.read-timeout=${ASSISTANT_HTTP_READ_TIMEOUT:10s}
assistant.deepseek.enabled=${DEEPSEEK_ENABLED:false}
assistant.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
assistant.deepseek.model=${DEEPSEEK_MODEL:}
assistant.deepseek.api-key=${DEEPSEEK_API_KEY:}
assistant.deepseek.timeout=20s
assistant.tool.max-rounds=${ASSISTANT_TOOL_MAX_ROUNDS:3}
assistant.tools.transport=${ASSISTANT_TOOLS_TRANSPORT:direct}
assistant.tools.mcp-base-url=${ASSISTANT_MCP_BASE_URL:http://localhost:8090/mcp}
assistant.tools.mcp-timeout=${ASSISTANT_MCP_TIMEOUT:10s}
assistant.rag.top-k=${ASSISTANT_RAG_TOP_K:3}
assistant.rag.embedding-dimensions=${ASSISTANT_RAG_EMBEDDING_DIMENSIONS:128}
assistant.rag.knowledge-path=${ASSISTANT_RAG_KNOWLEDGE_PATH:../knowledge/01-vehicle-maintenance-knowledge.md}
