spring:
  application: { name: appointment }
  datasource:
    url: ${APPOINTMENT_DB_URL:jdbc:postgresql://localhost:5432/appointment}
    username: ${APPOINTMENT_DB_USERNAME:appointment}
    password: ${APPOINTMENT_DB_PASSWORD:appointment}
  jpa: { open-in-view: false, hibernate: { ddl-auto: validate } }
  flyway: { enabled: true, locations: classpath:db/migration }
  kafka:
    bootstrap-servers: ${APPOINTMENT_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer: { acks: all, key-serializer: org.apache.kafka.common.serialization.StringSerializer, value-serializer: org.springframework.kafka.support.serializer.JsonSerializer }
server:
  port: ${APPOINTMENT_SERVER_PORT:8085}
management:
  endpoints: { web: { exposure: { include: health,info,metrics } } }
  endpoint: { health: { probes: { enabled: true } } }
appointment:
  partner-integration:
    base-url: ${APPOINTMENT_PARTNER_INTEGRATION_BASE_URL:http://localhost:8090}
  kafka:
    booked-topic: ${APPOINTMENT_BOOKED_TOPIC:appointment.booked.v1}
    completed-topic: ${APPOINTMENT_COMPLETED_TOPIC:appointment.completed.v1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
