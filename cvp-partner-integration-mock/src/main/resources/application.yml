spring:
  application: { name: partner-integration-mock }
server:
  port: ${PARTNER_MOCK_SERVER_PORT:8090}
management:
  endpoints: { web: { exposure: { include: health,info } } }
  endpoint: { health: { probes: { enabled: true } } }
partner-mock:
  appointment:
    base-url: ${PARTNER_MOCK_APPOINTMENT_BASE_URL:http://localhost:8085}
springdoc:
  api-docs: { path: /v3/api-docs }
  swagger-ui: { path: /swagger-ui.html }
