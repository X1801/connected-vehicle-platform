apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvp-telemetry-service
  namespace: cvp
spec:
  replicas: 1
  selector: {matchLabels: {app: cvp-telemetry-service}}
  template:
    metadata: {labels: {app: cvp-telemetry-service}}
    spec:
      containers:
        - name: telemetry
          image: cvp-telemetry-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: TELEMETRY_KAFKA_BOOTSTRAP_SERVERS, value: kafka:9092}
            - {name: TELEMETRY_DB_URL, value: jdbc:postgresql://postgres:5432/telemetry}
            - name: TELEMETRY_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: maintenance-reminder-postgres
                  key: POSTGRES_USER
            - name: TELEMETRY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maintenance-reminder-postgres
                  key: POSTGRES_PASSWORD
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /actuator/health, port: 8080}, initialDelaySeconds: 8, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: cvp-telemetry-service, namespace: cvp}
spec:
  selector: {app: cvp-telemetry-service}
  ports: [{port: 8080, targetPort: 8080}]
