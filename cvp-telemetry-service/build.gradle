plugins { id 'java'; id 'org.springframework.boot' version '3.5.16'; id 'io.spring.dependency-management' version '1.1.7' }
group='org.cvp'; version='0.0.1-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies { implementation 'org.springframework.boot:spring-boot-starter-web'; implementation 'org.springframework.boot:spring-boot-starter-validation'; implementation 'org.springframework.boot:spring-boot-starter-data-jpa'; implementation 'org.springframework.kafka:spring-kafka'; implementation 'org.springframework.boot:spring-boot-starter-actuator'; implementation 'org.flywaydb:flyway-core'; implementation 'org.flywaydb:flyway-database-postgresql'; implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'; runtimeOnly 'org.postgresql:postgresql'; testImplementation 'org.springframework.boot:spring-boot-starter-test'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
tasks.named('test') { useJUnitPlatform() }
